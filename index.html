<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMNAK – Official Merch</title>
<meta name="description" id="metaDesc" content="TEMNAK – oficiální merch a streetwear. Mikiny, trička, obrázky a šperky.">
<meta property="og:title" content="TEMNAK – Official Merch">
<meta property="og:description" id="ogDesc" content="TEMNAK – oficiální merch a streetwear.">
<meta property="og:type" content="website">
<meta property="og:image" content="temnak-logo.png">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--fg:#121212;--mute:rgba(18,18,18,.62);--line:rgba(18,18,18,.1);--frame:#f3f3f3;--hdr:76px;--ease:cubic-bezier(.2,.7,.2,1);--bagzoom:1.8;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:var(--hdr)}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{padding:0 clamp(16px,3vw,48px);max-width:1600px;margin:0 auto}
.phx{background:#fff6cc;padding:0 3px}

/* header: nav left / logo center / lang+account+cart right */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{height:var(--hdr);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
/* horní logo TEMNAK = obrázek temnak-logo.png.
   Soubor má kolem nápisu velký bílý okraj, proto je zobrazen ořezem (poměr stran nápisu zachován, bez deformace). */
.logo{display:block;position:relative;overflow:hidden;width:230px;aspect-ratio:7.5/1;justify-self:center;transition:transform .35s var(--ease),opacity .25s}
.logo img{position:absolute;max-width:none;width:210.05%;height:auto;left:-55.4%;top:-211.6%}
.logo:hover{transform:translateY(-1px);opacity:.78}
nav.d{display:flex;gap:26px;font-size:15px}
nav.d a{position:relative;padding:4px 0}
nav.d a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s}
nav.d a:hover::after{transform:scaleX(1)}
.right{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.lang{font-size:14px;margin-right:6px}
.lang button{opacity:.45;padding:4px 2px;transition:opacity .2s}
.lang button[aria-pressed=true],.lang button:hover{opacity:1}
.lang i{font-style:normal;opacity:.45}
.ib{width:44px;height:44px;display:grid;place-items:center;position:relative}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;transition:transform .3s var(--ease)}
.ib:hover svg{transform:translateY(-2px)}
/* tlačítko košíku = taška TEMNAK (obrázek holding-temnak.png).
   --bagzoom přiblíží tašku uvnitř čtverce (soubor má kolem tašky velký bílý okraj). */
.cartlogo{width:56px;height:56px}
.cartlogo .bag{width:56px;height:56px;overflow:hidden;display:block;transition:transform .3s var(--ease)}
.cartlogo .bag img{width:100%;height:100%;object-fit:contain;transform:scale(var(--bagzoom))}
.cartlogo:hover .bag{transform:translateY(-2px)}
.cartlogo svg{display:none}
.cartlogo.nologo .bag{display:none}
.cartlogo.nologo svg{display:block}
.count{position:absolute;top:4px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--fg);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.count[hidden]{display:none}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.35)}}
.burger{display:none}
.mnav{display:none;border-top:1px solid var(--line);padding:6px 0 14px}
.mnav a,.mnav>button{display:block;padding:11px 0;font-size:18px;text-align:left}
.mnav.open{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}}
@media(max-width:800px){
  :root{--hdr:64px}
  .bar{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
  nav.d{display:none}
  .burger{display:grid;justify-self:start;margin-left:-10px}
  .logo{width:150px}
  .lang{display:none}
  .mnav .lang{display:block;margin-top:8px;font-size:18px}
  .cartlogo,.cartlogo .bag{width:50px;height:50px}
}
@media(max-width:360px){
  .logo{width:124px}
}
@media(min-width:801px){.mnav{display:none!important}}

/* slideshow – image banners like Shopify/Dawn (poměr stran 16:9 podle bannerů) */
.hero{position:relative;background:var(--frame);overflow:hidden;aspect-ratio:16/9}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;display:block}
.slide.on{opacity:1;visibility:visible;z-index:1}
.slide img,.slide .ph{width:100%;height:100%;object-fit:cover}
.slide .ph{display:grid;place-items:center;color:var(--mute);font-size:13px;background:#e9e9e9}
.ctrl{position:absolute;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;background:var(--bg);border:1px solid var(--line)}
.ctrl button{width:42px;height:42px;display:grid;place-items:center}
.ctrl svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.ctrl .cnt{min-width:58px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.ctrl .pp{border-left:1px solid var(--line)}
.ctrl .pp .ic-play{display:none}
.ctrl.paused .pp .ic-play{display:block}.ctrl.paused .pp .ic-pause{display:none}

/* shop: sidebar + products */
section{padding:clamp(32px,5vw,64px) 0}
#shop{padding-top:clamp(24px,3vw,40px)}
.shop{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:900px){.shop{grid-template-columns:200px minmax(0,1fr);gap:clamp(28px,3vw,56px);align-items:start}}
.side{position:relative}
@media(min-width:900px){.side{position:sticky;top:calc(var(--hdr) + 28px)}}
.side-h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.cats{list-style:none;display:flex;flex-direction:column;gap:2px}
.cats a{display:flex;align-items:center;gap:0;padding:7px 0;font-size:16px;color:var(--mute);transition:color .2s,gap .3s var(--ease)}
.cats a::before{content:"";height:1px;width:0;background:var(--fg);transition:width .3s var(--ease)}
.cats a:hover{color:var(--fg)}
.cats a:hover::before{width:8px}
.cats a:hover{gap:8px}
.cats a[aria-current=true]{color:var(--fg);font-weight:600;gap:10px}
.cats a[aria-current=true]::before{width:16px}
.cats .all{margin-bottom:8px;padding-bottom:9px;border-bottom:1px solid var(--line);font-size:14px}
.side-tg{display:none}
@media(max-width:899px){
  .side-h{display:none}
  .side-tg{display:flex;width:100%;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:12px 16px;font-size:15px;transition:border-color .2s}
  .side-tg:hover{border-color:var(--fg)}
  .side-tg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .3s var(--ease)}
  .side-tg[aria-expanded=true] svg{transform:rotate(180deg)}
  .cats{display:none;border:1px solid var(--line);border-top:0;padding:6px 16px 10px}
  .cats.open{display:flex;animation:fade .25s}
}
.tb{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;min-height:64px;flex-wrap:wrap}
.tb h2{font-size:clamp(22px,2.2vw,28px);font-weight:400;line-height:1.1}
.tb .cc{font-size:13px;color:var(--mute);margin-top:2px}
.ratenote{font-size:12px;color:var(--mute);margin:-12px 0 20px;text-align:right}
.ratenote[hidden]{display:none}

/* přepínač měn – segmentová pilulka s plynule se posouvající volbou */
.curx{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.curx-l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1}
.curx-seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border:1px solid var(--fg);border-radius:999px;background:var(--bg);box-shadow:0 8px 22px -16px rgba(18,18,18,.5)}
.curx-seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / 3);border-radius:999px;background:var(--fg);transform:translateX(calc(var(--pos,0) * 100%));transition:transform .45s var(--ease)}
.curx-seg button{position:relative;z-index:1;min-width:56px;height:34px;padding:0 6px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--fg);transition:color .3s}
.curx-seg button:hover{opacity:.7}
.curx-seg button[aria-pressed=true]{color:#fff;opacity:1}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:36px 18px}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(4,1fr);gap:40px 20px}}
.card{text-align:left;display:block;width:100%;animation:cardIn .55s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes cardIn{from{opacity:.001;transform:translateY(14px)}}
.frame{aspect-ratio:4/5;background:var(--frame);overflow:hidden;position:relative}
.frame .a,.frame .b{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s,transform .6s var(--ease)}
.frame .blank{display:grid;place-items:center;background:var(--frame)}
.frame .blank svg{width:38%;height:auto;max-height:60%;stroke:var(--fg);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.frame .b{opacity:0}
.card:hover .frame .a.has2{opacity:0}
.card:hover .frame .b{opacity:1}
.card:hover .frame>:not(.badge){transform:scale(1.03)}
.badge{position:absolute;top:8px;left:8px;z-index:2;background:var(--fg);color:#fff;font-size:11px;line-height:1;padding:6px 9px;border-radius:20px}
.card h3{margin-top:12px;font-size:15px;font-weight:400}
.card .p{font-size:14px;color:var(--mute)}
.catempty{border:1px dashed var(--line);padding:clamp(40px,7vw,90px) 24px;text-align:center;color:var(--mute);animation:fade .4s}
.catempty b{display:block;color:var(--fg);font-weight:400;font-size:20px;margin-bottom:6px}
.catempty[hidden]{display:none}
.rv{opacity:0;transform:translateY(12px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}

/* oznamovací lišta mezi obchodem a projekty – bílá */
.promo{background:#fff;color:var(--fg);padding:clamp(18px,2.4vw,26px) 0;text-align:center;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.promo .wrap{display:flex;justify-content:center}
.promo p{position:relative;display:inline-block;max-width:100%;padding:0 2px 8px;font-size:clamp(13px,1.5vw,16px);letter-spacing:.06em;line-height:1.5;overflow-wrap:anywhere;animation:promoIn .9s var(--ease) both,promoDrift 7s ease-in-out 1s infinite}
.promo p::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--fg);transform-origin:left;animation:promoLine 5s var(--ease) 1s infinite}
@keyframes promoIn{from{opacity:0;transform:translateY(8px)}}
@keyframes promoDrift{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes promoLine{0%{transform:scaleX(0);transform-origin:left}45%{transform:scaleX(1);transform-origin:left}55%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}

/* projects (nahrazuje YouTube video) */
.projects{border-top:1px solid var(--line)}
.title{font-size:clamp(24px,3vw,32px);font-weight:400;text-align:center;margin-bottom:6px}
.sub2{text-align:center;margin-bottom:clamp(24px,3vw,36px);font-size:14px;color:var(--mute)}
.pgrid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:700px){.pgrid{grid-template-columns:repeat(3,1fr);gap:20px}}
.pcard{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--bg);transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .3s}
.pcard:hover{transform:translateY(-6px);box-shadow:0 18px 40px -22px rgba(18,18,18,.35);border-color:rgba(18,18,18,.22)}
.pcard .pf{aspect-ratio:4/3;background:var(--frame);overflow:hidden;position:relative}
.pcard .pf img,.pcard .pf .blank{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.pcard .pf img.contain{object-fit:contain}
.pcard .pf .blank{display:grid;place-items:center;font-size:clamp(48px,6vw,80px);font-weight:300;color:rgba(18,18,18,.12);letter-spacing:-.02em}
.pcard:hover .pf img,.pcard:hover .pf .blank{transform:scale(1.04)}
.pcard .pb{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:18px 18px 20px}
.pcard h3{font-size:18px;font-weight:400}
.pcard p{font-size:13px;color:var(--mute)}
.pcard .arr{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:background .3s,color .3s,transform .4s var(--ease),border-color .3s}
.pcard .arr svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.pcard:hover .arr{background:var(--fg);color:#fff;border-color:var(--fg);transform:rotate(-45deg)}
.pgrid .rv:nth-child(2){transition-delay:.08s}
.pgrid .rv:nth-child(3){transition-delay:.16s}

/* footer */
footer{border-top:1px solid var(--line);padding:44px 0 22px;background:var(--bg)}
.fg{display:grid;gap:30px;grid-template-columns:1fr}
@media(min-width:560px){.fg{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.fg{grid-template-columns:repeat(4,1fr) 1.4fr}}
.fg h4{font-size:15px;font-weight:600;margin-bottom:8px}
.fg p,.fg li{font-size:14px;color:var(--mute)}
.fg ul{list-style:none;display:flex;flex-direction:column;gap:3px}
.fg a:hover,.fg li button:hover{color:var(--fg);text-decoration:underline}
.fg li button{color:var(--mute);font-size:14px;text-align:left}
.nl form{display:flex;border:1px solid var(--line);margin-top:10px;transition:border-color .2s}
.nl form:focus-within{border-color:var(--fg)}
.nl input{flex:1;min-width:0;border:0;padding:12px 14px;font-size:14px;outline:0;background:transparent}
.nl button{padding:0 16px;font-size:14px;border-left:1px solid var(--line);transition:background .2s,color .2s}
.nl button:hover{background:var(--fg);color:#fff}
.nl small{display:block;font-size:12px;color:var(--mute);margin-top:8px}
.nl small a{text-decoration:underline}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.msg.ok{color:#1d6b33}.msg.bad{color:#b00020}
.fb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.fb a{text-decoration:underline}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--bg);z-index:100;transform:translateX(100%);transition:transform .35s var(--ease);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 6px 20px;border-bottom:1px solid var(--line)}
.dh h3{font-size:20px;font-weight:400}
.db{flex:1;overflow:auto;padding:6px 20px}
.df{padding:16px 20px 20px;border-top:1px solid var(--line);max-height:62%;overflow:auto}
.row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.row .th{width:72px;aspect-ratio:4/5;background:var(--frame);flex:none}
.row .i{flex:1;font-size:14px;color:var(--mute)}
.row .i b{display:block;font-size:15px;font-weight:500;color:var(--fg)}
.q{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:8px;color:var(--fg)}
.q button{width:32px;height:32px}
.q span{min-width:28px;text-align:center}
.rm{font-size:12px;text-decoration:underline;margin-left:10px}
.sum{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:4px;color:var(--mute)}
.sum.tot{font-weight:600;font-size:16px;color:var(--fg);margin:8px 0 6px;padding-top:8px;border-top:1px solid var(--line)}
.note{font-size:12px;color:var(--mute);margin-bottom:14px}
.empty{padding:48px 0;text-align:center;color:var(--mute)}
.btn{display:block;width:100%;padding:14px 24px;background:var(--fg);color:#fff;border:1px solid var(--fg);text-align:center;font-size:15px;letter-spacing:.02em;transition:background .2s,color .2s}
.btn:hover{background:#fff;color:var(--fg)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:#fff;color:var(--fg)}
.btn.ghost:hover{background:var(--fg);color:#fff}
.shipf{border:0;margin:0 0 12px}
.shipf legend{font-size:13px;font-weight:600;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer;transition:border-color .2s}
.opt:hover,.opt:has(input:checked){border-color:var(--fg)}
.opt input{accent-color:var(--fg)}
.opt span{flex:1;font-size:13px;line-height:1.35}
.opt small{display:block;color:var(--mute);font-size:12px}
.opt em{font-style:normal;font-size:13px;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;pointer-events:none;opacity:0;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.mb{background:var(--bg);width:min(900px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr;transform:translateY(12px);transition:transform .3s;position:relative}
.modal.on .mb{transform:none}
@media(min-width:760px){.mb{grid-template-columns:1fr 1fr}}
.mb.one{grid-template-columns:1fr;width:min(560px,100%)}
.mb.doc{grid-template-columns:1fr;width:min(860px,100%)}
.mi{padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.mi h3{font-size:28px;font-weight:400;line-height:1.15}
.sz{display:flex;gap:8px;flex-wrap:wrap}
.sz button{min-width:48px;height:44px;border:1px solid var(--line);border-radius:22px;padding:0 16px;transition:background .2s,color .2s,border-color .2s}
.sz button:hover{border-color:var(--fg)}
.sz button[aria-pressed=true]{background:var(--fg);color:#fff;border-color:var(--fg)}
.x{position:absolute;top:4px;right:4px;z-index:2;background:rgba(255,255,255,.8);border-radius:50%}
.err{color:#b00020;font-size:13px;min-height:18px}
.ship-info{border:1px solid var(--line);padding:12px 14px;font-size:13px;color:var(--mute)}
.ship-info b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}
.ship-info ul{padding-left:16px;margin-bottom:4px}
.ship-info small{font-size:12px}
/* forms (auth, checkout) */
.fm{display:flex;flex-direction:column;gap:12px}
.fm label{display:flex;flex-direction:column;gap:5px;font-size:13px}
.fm input:not([type=checkbox]),.fm select{border:1px solid var(--line);padding:11px 12px;font-size:15px;outline:0;background:#fff;transition:border-color .2s}
.fm input:focus,.fm select:focus{border-color:var(--fg)}
.fm .chk{flex-direction:row;align-items:flex-start;gap:8px;font-size:13px;color:var(--mute)}
.fm .chk input{margin-top:3px;accent-color:var(--fg)}
.fm .chk a,.fm small a{text-decoration:underline;color:var(--fg)}
.fm small{font-size:12px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
.swt{font-size:14px;color:var(--mute);text-align:center;margin-top:4px}
.swt .lnk{color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:2px 0;margin-left:4px}
.swt .lnk:hover{opacity:.7}
.pend{font-size:12px;background:var(--frame);padding:8px 10px;color:var(--fg)}
.colist{font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.colist div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
/* legal */
.legal{padding:36px clamp(20px,4vw,48px) 44px;font-size:14px;line-height:1.65}
.legal h2{font-size:clamp(24px,3vw,32px);font-weight:400;margin-bottom:6px;padding-right:40px}
.legal h3{font-size:16px;font-weight:600;margin:22px 0 6px}
.legal p,.legal li{color:rgba(18,18,18,.8);margin-bottom:6px}
.legal ul,.legal ol{padding-left:20px}
.legal a{text-decoration:underline}
.legal table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.legal th,.legal td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.legal .warn{border-left:3px solid #c98a00;background:#fffaf0;padding:10px 12px;margin:12px 0;color:var(--fg)}
.legal .meta{font-size:12px;color:var(--mute)}
.legal .ccbtn{display:inline-block;width:auto;margin-top:8px}
/* cookies */
.ccb{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);width:min(760px,calc(100% - 24px));background:var(--bg);border:1px solid var(--line);box-shadow:0 18px 50px -20px rgba(0,0,0,.35);z-index:120;padding:20px 22px;display:grid;gap:14px;opacity:0;transition:opacity .4s,transform .45s var(--ease)}
.ccb.on{opacity:1;transform:translate(-50%,0)}
.ccb[hidden]{display:none}
.ccb h2{font-size:16px;font-weight:600}
.ccb p{font-size:13px;color:var(--mute)}
.ccb p a{text-decoration:underline;color:var(--fg)}
.ccb .acts{display:flex;gap:8px;flex-wrap:wrap}
.ccb .acts .btn{width:auto;flex:1 1 150px;padding:12px 16px;font-size:14px}
.tg{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.tg b{font-weight:600;font-size:14px}
.tg p{font-size:13px;color:var(--mute)}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:13px;background:#d6d6d6;transition:background .25s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sw input:checked+span{background:var(--fg)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:disabled+span{opacity:.5}
.sw input:focus-visible+span{outline:2px solid var(--fg);outline-offset:2px}
.ccacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ccacts .btn{flex:1 1 140px;width:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const LEGAL_IDS=["obchodni-podminky","ochrana-osobnich-udaju","cookies","doprava"];
let lang="cs",cur="CZK",cart=[],shipSel=null,slide=0,timer,playing=true,openProd=null,selSize=null,consent=null,catSel="all",authTab="login";
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
["a_lang","a_cur","a_cart"].forEach(ls.del);
function readConsent(){try{const c=JSON.parse(ls.get("tmk_consent"));if(c&&c.v===CONSENT_VERSION&&Date.now()-c.ts<CONSENT_DAYS*864e5)return c}catch(e){}return null}
consent=readConsent();
try{const c=JSON.parse(ls.get("tmk_cart")||"{}");cart=Array.isArray(c.items)?c.items.filter(i=>PRODUCTS.some(p=>p.id===i.id)):[];shipSel=SHIPPING.some(s=>s.id===c.ship)?c.ship:null}catch(e){}
if(consent?.preferences){lang=T[ls.get("tmk_lang")]?ls.get("tmk_lang"):"cs";cur=RATES[ls.get("tmk_cur")]?ls.get("tmk_cur"):"CZK"}
const t=k=>T[lang][k];
// L = vybere text podle jazyka (řetězec zůstane beze změny)
const L=x=>x&&typeof x==="object"?(x[lang]??x.cs??""):(x??"");
const money=n=>new Intl.NumberFormat(lang==="cs"?"cs-CZ":"en-US",{style:"currency",currency:cur,minimumFractionDigits:2,maximumFractionDigits:2}).format(n/RATES[cur]);
const save=()=>{
  ls.set("tmk_cart",JSON.stringify({items:cart,ship:shipSel}));
  if(consent?.preferences){ls.set("tmk_lang",lang);ls.set("tmk_cur",cur)}else{ls.del("tmk_lang");ls.del("tmk_cur")}
};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce)playing=false;
const catLabel=id=>id==="all"?t("all"):L(CATEGORIES.find(c=>c.id===id)?.label)||t("all");

/* slideshow */
function buildHero(){
  $$(".slide").forEach(s=>s.remove());
  const ctrl=$("#ctrl");
  SLIDES.forEach((s,i)=>{
    const a=document.createElement("a");
    a.href="#shop";a.className="slide"+(i===slide?" on":"");
    a.setAttribute("role","group");a.setAttribute("aria-label",(i+1)+" / "+SLIDES.length);
    a.innerHTML=s.img?`<img src="${s.img}" alt="TEMNAK" ${i?'loading="lazy"':""}>`:`<div class="ph">${t("ph")} ${i+1}</div>`;
    $("#hero").insertBefore(a,ctrl);
  });
  $("#cnt").textContent=(slide+1)+" / "+SLIDES.length;
  syncPP();
}
function go(n){
  slide=(n+SLIDES.length)%SLIDES.length;
  $$(".slide").forEach((s,i)=>s.classList.toggle("on",i===slide));
  $("#cnt").textContent=(slide+1)+" / "+SLIDES.length;
}
function restart(){clearInterval(timer);if(playing)timer=setInterval(()=>go(slide+1),2000)}
function syncPP(){
  $("#ctrl").classList.toggle("paused",!playing);
  $("#pp").setAttribute("aria-label",t(playing?"pause":"play"));
}
$(".prev").onclick=()=>{go(slide-1);restart()};
$(".next").onclick=()=>{go(slide+1);restart()};
$("#pp").onclick=()=>{playing=!playing;syncPP();restart()};
let tx=0;
$("#hero").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
$("#hero").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40){go(slide+(d<0?1:-1));restart()}});

  $("#fCats").innerHTML=CATEGORIES.map(c=>`<li><a href="?kat=${c.id}" data-cat="${c.id}">${L(c.label)}</a></li>`).join("");

}
function setCat(id,push){

/* modal */
function renderModal(){
  const p=openProd;if(!p)return;
  $("#mImg").innerHTML=pic(p);
  $("#mInfo").innerHTML=`<h3>${L(p.name)}</h3>
    <div data-testid="modal-price">${money(p.price)}</div>

function openModal(id){

$("#mInfo").addEventListener("click",e=>{
  const s=e.target.closest("[data-size]");
  if(s){selSize=s.dataset.size;renderModal();return}
  if(e.target.id==="addBtn"){
    const needs=openProd.sizes?.length;
    if(needs&&!selSize){$("#err").textContent=t("pick");return}
    const sz=needs?selSize:"",k=openProd.id+"-"+sz,f=cart.find(i=>i.key===k);
    f?f.qty++:cart.push({key:k,id:openProd.id,size:sz,qty:1});
    save();renderCart();
    const c=$("#count");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");
    $("#addBtn").textContent="✓ "+t("added");
    setTimeout(()=>{closeAll();openCart()},600);
  }
});

/* cart / shopping bag */
const shipPrice=s=>s.priceSet?money(s.price):t("shipTbd");
function totals(){
  const sub=cart.reduce((a,i)=>a+(PRODUCTS.find(x=>x.id===i.id)?.price||0)*i.qty,0);
  const s=SHIPPING.find(x=>x.id===shipSel);
  return {sub,s,ship:s?s.price:0,tot:sub+(s?s.price:0)};
}
const sumRows=()=>{const {sub,s,tot}=totals();return `<div class="sum"><span>${t("sub")}</span><span data-testid="cart-subtotal">${money(sub)}</span></div>
  <div class="sum"><span>${t("ship")}</span><span data-testid="cart-shipping">${s?shipPrice(s):t("ship_pick")}</span></div>
  <div class="sum tot"><span>${t("total")}</span><span data-testid="cart-total">${money(tot)}</span></div>
  ${cur!=="CZK"?`<p class="note">${t("rate")(cur,RATES[cur])}</p>`:""}`};
function renderCart(){
  const n=cart.reduce((a,i)=>a+i.qty,0);
  const c=$("#count");c.textContent=n;c.hidden=!n;
  const body=$("#cartBody"),foot=$("#cartFoot");
  if(!cart.length){body.innerHTML=`<p class="empty" data-testid="cart-empty">${t("empty")}</p>`;foot.innerHTML="";return}
  body.innerHTML=cart.map(i=>{
    const p=PRODUCTS.find(x=>x.id===i.id);
    return `<div class="row" data-testid="cart-item-${i.key}"><div class="th">${p.img?`<img src="${p.img}" alt="" style="width:100%;height:100%;object-fit:cover">`:""}</div>
      <div class="i"><b>${L(p.name)}</b>${i.size?`${t("size")}: ${i.size} · `:""}${money(p.price)}<br>
      <span class="q"><button data-q="-1" data-k="${i.key}" aria-label="−">−</button><span>${i.qty}</span><button data-q="1" data-k="${i.key}" aria-label="+">+</button></span>
      <button class="rm" data-rm="${i.key}">${t("remove")}</button></div></div>`}).join("");
  foot.innerHTML=`<fieldset class="shipf"><legend>${t("ship_h")}</legend>
    ${SHIPPING.map(s=>`<label class="opt"><input type="radio" name="ship" value="${s.id}" ${s.id===shipSel?"checked":""} data-testid="shipping-option-${s.id}">
      <span><b>${L(s.label)}</b><small>${L(s.carrier)} · ${t(s.region==="cz"?"deliv_cz":"deliv_sk").split(": ")[1]}</small></span><em>${shipPrice(s)}</em></label>`).join("")}
    </fieldset>${sumRows()}
    <p class="note">${t("demo")}</p><button class="btn" id="toCo" ${shipSel?"":"disabled"} data-testid="proceed-to-checkout-button">${t("to_checkout")}</button>`;
}
$("#cartBody").addEventListener("click",e=>{
  const q=e.target.closest("[data-q]"),r=e.target.closest("[data-rm]");
  if(!q&&!r)return;
  if(q){const i=cart.find(x=>x.key===q.dataset.k);i.qty+=+q.dataset.q;if(i.qty<1)cart=cart.filter(x=>x!==i)}
  if(r)cart=cart.filter(x=>x.key!==r.dataset.rm);
  save();renderCart();
});
$("#cartFoot").addEventListener("change",e=>{if(e.target.name==="ship"){shipSel=e.target.value;save();renderCart()}});
$("#cartFoot").addEventListener("click",e=>{if(e.target.id==="toCo")openCheckout()});

/* cookie consent */
function activateScripts(){
  $$('script[type="text/plain"][data-consent]').forEach(s=>{
    if(!consent?.[s.dataset.consent]||s.dataset.done)return;
    const n=document.createElement("script");
    [...s.attributes].forEach(a=>{if(a.name!=="type"&&a.name!=="data-consent")n.setAttribute(a.name,a.value)});
    n.text=s.text;s.dataset.done="1";s.after(n);
  });
}
function setConsent(o){
  const prev=consent;
  consent={v:CONSENT_VERSION,ts:Date.now(),preferences:!!o.preferences,analytics:!!o.analytics,marketing:!!o.marketing};
  ls.set("tmk_consent",JSON.stringify(consent));
  save();hideBanner();closeAll();
  if(prev&&["analytics","marketing"].some(k=>prev[k]&&!consent[k])){location.reload();return}
  activateScripts();
}
function showBanner(){const b=$("#ccb");b.hidden=false;requestAnimationFrame(()=>b.classList.add("on"))}
function hideBanner(){const b=$("#ccb");b.classList.remove("on");b.hidden=true}
function openCC(){
  $("#ccPref").checked=!!consent?.preferences;$("#ccAna").checked=!!consent?.analytics;$("#ccMkt").checked=!!consent?.marketing;
  OVERLAYS.forEach(s=>{$(s).classList.remove("on");$(s).setAttribute("aria-hidden","true")});
  show("#ccm");
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-cc-open]")){openCC();return}
  const b=e.target.closest("[data-cc]");if(!b)return;
  const a=b.dataset.cc;
  if(a==="accept")setConsent({preferences:1,analytics:1,marketing:1});
  else if(a==="reject")setConsent({});
  else setConsent({preferences:$("#ccPref").checked,analytics:$("#ccAna").checked,marketing:$("#ccMkt").checked});
});

}
function applyLang(){
  document.documentElement.lang=lang;
  document.title=t("title");
  $("#metaDesc").content=t("desc");$("#ogDesc").content=t("ogdesc");
  $$("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(typeof v==="string")el.textContent=v});
  $$("[data-al]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.al)));
  $$("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  buildHero();renderSide();renderProjects();renderAll();
  if($("#legal").classList.contains("on"))route();
}
$$("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;save();applyLang()});

const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});
$$(".rv").forEach(el=>io.observe(el));

$("#yr").textContent=new Date().getFullYear();
catSel=CATEGORIES.some(c=>c.id===catFromUrl())?catFromUrl():"all";
applyLang();restart();
if(consent)activateScripts();else showBanner();
route();
</script>
